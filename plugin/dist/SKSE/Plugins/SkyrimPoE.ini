; SkyrimPoE 설정 (2단계: 뼈대와 첫 조각)
; 기본값은 docs/설계-현황.md 결정 1~150 기준입니다.

[General]
; 패널 열기/닫기 DirectInput 스캔 코드 (0x25 = K, 결정 24 잠정)
PanelKey = 0x25
; 프렌지 모드(BerserkerFrenzy.esp) 발동 중 사이클론 입력 양보 (결정 63)
YieldToFrenzy = true
; 2단계 테스트용 초기 젬 9종 1회 자동 지급 (4단계에서 false 전환 예정)
GiveStarterGems = true
; 2단계 임시 보조 소켓 수 (1~5, 기본 3)
StarterSockets = 3
; 주 갱신 프레임당 예약 처리 시간 상한 (밀리초, 0이면 무제한)
MainUpdateBudgetMs = 2.0

[Conversion]
; 주는 피해 환산 상수 K = B * N (결정 92)
OffenseK = 75.0
; 기대 대비 100% 기준 타격 수 N (잠정, B = K / N = 25)
OffenseBaseHits = 3.0
; 지속 피해 환산 기준 타격률 (초당 횟수, 결정 64)
BaseHitRate = 1.6
; 오픈월드 주는 피해 되돌림 비율 r (0.0~1.0, 결정 46 잠정)
OffenseRollback = 0.5
; 오픈월드 받는 피해 되돌림 비율 r (0.0~1.0, 결정 46 잠정)
DefenseRollback = 0.5
; 받는 타격 기준값 Dref (결정 94)
DefenseDref = 10.7
; 기대 방어 프로필 장비 증가 배율 I (1.0 = +100%, 결정 69 잠정)
ExpectedArmorIncrease = 1.0
; 기대 생명력 증가 배율 I_life (결정 70 잠정)
ExpectedLifeIncrease = 0.0
; 기대 마나 증가 배율 I_mana (결정 144)
ExpectedManaIncrease = 0.0
; 기대 원소 저항 단일 어픽스 수 n (결정 74 잠정)
ExpectedResistAffixes = 3.0
; 5막/10막 카오스 저항 감소 시작 레벨 (결정 74 잠정)
Act5Level = 45
Act10Level = 67

[Experience]
; 오픈월드 스카이림 레벨 차 1:1 보정 상하한 (결정 146)
LevelDiffClamp = 10
; 보스·드래곤 유효 레벨 가산 및 최대 가산 (결정 146)
BossLevelBonus = 3
MaxBossLevelBonus = 5
; 높은 적 레벨당 추가 경험치 비율 및 최대 배율 (결정 146)
HigherEnemyBonusPerLevel = 0.10
HigherEnemyMaxMultiplier = 2.0
; 낮은 적 PoB 벌칙 하한 배율 (결정 146)
LowerEnemyMinMultiplier = 0.01
; 2단계 선형 임시 곡선 kills(L) = KillsBase + KillsSlope * (L - 1) (결정 147)
KillsBase = 10.0
KillsSlope = 2.0
BaseKillXp = 100.0
; 장착 젬 처치 경험치 지급 비율 (결정 108)
GemXpRatio = 0.10

[Cyclone]
; 강공격 입력 지정: rightHand (좌클릭 길게 누르기, 결정 54)
PowerAttackInput = rightHand
; 최소 회전 지속 시간(초, 결정 49 잠정)
MinChannelSeconds = 0.6
; 채널링 중 무시할 최대 경직 세기 (결정 56)
ChannelIgnoreStagger = 0.5
