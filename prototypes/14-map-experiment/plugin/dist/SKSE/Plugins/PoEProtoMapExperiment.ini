[Experiment]
; true면 시험이 끝난 뒤 게임을 끈다. TourDungeon을 주면 무시하고 켜 둔다.
QuitWhenDone=true
; G-1에서 정리 방법마다 되풀이할 회수(1~20)
Cycles=5
; G-1·G-2를 돌릴 던전 키(목록 파일의 key)
CleanupDungeon=embershard
ResetDungeon=pinemoon
; 자동 시험 뒤 이 던전 입구에 남아 화면으로 룸바운드를 본다(G-5). 비우면 남지 않는다.
TourDungeon=
; 시간(초)
MainMenuDelaySeconds=2
LoadTimeoutSeconds=60
ArriveTimeoutSeconds=40
DetachTimeoutSeconds=20
PursuitSeconds=25
