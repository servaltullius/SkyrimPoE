; PoE Proto 8: 엔진 타격의 피해를 바꾸는 자리를 시험한다. 자세한 것은 프로토타입 폴더의 README.

[General]
; 모드를 차례로 바꾸는 키(DirectInput 스캔 코드). 0x3D = F3. 0이면 쓰지 않음.
; F8(0x42)은 프로토타입 2의 TestStaggerKey와 겹친다(2026-11-17 시험에서 확인).
ModeKey = 0x3D
; 처음 모드: observe(관찰) / set(바꾸기) / zero(지우기) / replace(대신 주기)
StartMode = observe
; set과 replace에서 쓸 값(난이도 배율 전). 0 이상 10000 이하.
Value = 10.0
; player: 공격자가 플레이어인 타격만 바꿈 / all: 모든 타격
Scope = player
; 작업 큐가 다시 부르는 자리도 가로채서 적음(바꾸지는 않음)
HookQueue = true
; 게임에 들어갔을 때와 모드를 바꿀 때 화면에 알림
Notify = true
