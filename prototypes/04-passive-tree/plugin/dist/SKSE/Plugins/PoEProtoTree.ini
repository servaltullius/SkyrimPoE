; PoE Proto 4: 패시브 트리 화면 시험용 설정
; 게임을 시작할 때 한 번 읽습니다.

[General]
; 트리 화면을 여닫는 키(키보드 DirectInput 스캔 코드). 0x40 = F6
; 누를 때마다 다음으로 넘어갑니다: 닫힘 -> 게임을 멈추고 열기 -> 게임을 돌린 채 열기 -> 닫힘
; 화면 오른쪽 아래의 "다음 단계", "닫기" 버튼으로도 됩니다. 검색창 밖에서 Esc를 눌러도 닫힙니다.
ToggleKey = 0x40

; true면 단계마다 처음 열릴 때 측정을 스스로 돌리고 결과를 로그에 남깁니다(단계마다 약 36초).
; "게임을 멈추고 열기"의 측정이 끝나면 화면이 스스로 "게임을 돌린 채 열기"로 넘어가 이어서 잽니다(이 동안 게임이 돕니다).
; 한 번 잰 단계는 게임을 다시 시작하기 전까지 다시 재지 않습니다. 측정 도중에 F6을 누르면 그 측정은 버려집니다.
; false면 열기만 합니다. 직접 만져 보기만 할 때 씁니다.
AutoBench = true

; true면 검색창에 들어온 글자와 조합(한글 등) 상태를 로그에 남깁니다. 입력이 안 될 때 어디서 막히는지 가르는 데 씁니다.
; 친 글자가 로그에 그대로 남으므로 평소에는 false로 둡니다.
LogSearchInput = false
