; PoE Proto 7: 환산의 값을 정하기 위한 측정용 설정
; 게임을 시작할 때 한 번 읽습니다.
; 이 모드는 켜 두기만 하면 평소 플레이를 옆에서 기록합니다. 게임에 아무것도 놓지 않고 아무 값도 바꾸지 않습니다.
; 기록은 문서\My Games\Skyrim Special Edition\SKSE\PoEProtoMeasure\ 에 게임을 켤 때마다 새 파일로 남습니다.

[General]
; 지금까지 모은 수를 화면에 띄우는 키(키보드 DirectInput 스캔 코드). 0x3E = F4, 0 = 쓰지 않음
; 다른 모드가 F4를 쓰고 있으면 다른 키로 바꾸세요.
StatusKey = 0x3E

; true면 액터의 체력 피해 함수에 끼어들어 피해를 기록합니다(주고받는 피해, 타격 수, 잡는 시간).
; 게임 안의 모든 액터가 피해를 받을 때 이 함수를 지납니다. 피해를 주고받는 순간에 게임이 튕기면 false로 두고 다시 켜세요.
; false면 주변 액터의 레벨과 체력, 적중·사망 이벤트만 기록합니다.
HookDamage = true

; 주변 액터를 훑는 간격(초). 0.5 이상 10 이하.
ScanSeconds = 1.0

; true면 게임에 들어갔을 때 "측정 중" 알림을 한 번 띄웁니다.
Notify = true

; 기록 파일 하나의 한도(MB). 닿으면 기록을 멈추고 알립니다. 16 이상 4096 이하.
MaxSessionMB = 256
