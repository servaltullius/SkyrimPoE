; PoE Proto 2: 입력에 스킬 얹기 시험용 설정
; 게임을 시작할 때 한 번 읽습니다. 회전 클립의 번호는 게임 안에서 CycleKey로 바꿀 수 있습니다.

[General]
; false면 이 DLL은 아무 훅도 설치하지 않습니다.
Enabled = true

; 회전 모션을 재생하는 쪽. 사이클론은 OAR 방식으로 정해졌습니다(설계-현황 결정 48).
;   oar      = OAR 이동 클립 교체. "[PoE Proto] 1B Cyclone - OAR" 모드가 켜져 있어야 합니다.
;   injector = Animation Injector 반복 동작(비교 기록용). "[PoE Proto] 1A Cyclone - Animation Injector" 모드가
;              꺼져 있으면 강공격만 사라지고 회전은 나오지 않습니다.
Motion = oar

; 채널링을 시작하는 계기
;   powerAttack = 게임이 강공격을 시작하려는 순간을 가로채 채널링으로 바꿉니다. 공격 버튼을 누르고 있는 동안 이어집니다.
;   hold        = 오른손 공격 버튼을 HoldSeconds 넘게 누르고 있으면 시작합니다. 강공격이 다른 키에 있는 환경용입니다.
Trigger = powerAttack

; Trigger = hold일 때 기다리는 시간(초). 0.05 ~ 2
HoldSeconds = 0.3

; 버튼을 일찍 떼도 이 시간(초)만큼은 회전합니다. 회전 클립 한 바퀴가 0.6초입니다. 0 = 떼는 즉시 끝남. 0 ~ 10
MinSeconds = 0.6

; 한 번의 채널링이 이어질 수 있는 최대 시간(초). 1 ~ 300
MaxSeconds = 60

; ---- 회전과 타격 (OAR 방식) ----
; 클립은 무기를 뻗은 정지 자세만 담고, 몸을 돌리는 것과 타격은 이 DLL이 맡습니다(설계-현황 결정 50).

; true면 스켈레톤의 "NPC" 노드를 매 프레임 돌려 몸을 회전시킵니다. false면 클립에 구워 넣은 회전에 맡깁니다.
SpinByDll = true

; true면 위에서 볼 때 시계 방향으로 돕니다. 기본은 반시계 방향(오른쪽에 든 무기가 뒤따라옴)입니다.
SpinClockwise = false

; true면 일정 주기로 주변의 적에게 근접 타격을 적용합니다. false면 클립의 타격 주석에 맡깁니다.
HitsByDll = true

; 무기 속도가 1.0일 때의 초당 타격 수. 실제 값은 든 무기의 속도와 공격 속도 배율을 곱합니다. 0.5 ~ 20
; 기본 3.0은 PoE 사이클론의 "공격 속도 300%"에 맞춘 값입니다.
HitsPerSecond = 3.0

; 타격 한 번에 도는 바퀴 수. 회전 속도(초당 바퀴 수) = 초당 타격 수 x 이 값. 0.1 ~ 4
TurnsPerHit = 0.75

; 타격 반경(게임 단위, 약 1.4cm). PoE의 기본 반경 1.6미터가 약 112입니다. 50 ~ 600
HitRadius = 160

; 타격 한 번의 피해 배율(무기의 평소 타격 한 번에 대한 비율). 0.05 ~ 5
HitDamageMult = 0.5

; true면 적대적이지 않은 액터도 타격합니다. 시험용입니다. 켜면 주민을 때려 범죄가 될 수 있습니다.
HitNeutral = false

; ---- 치명타 시 시전 (발동 젬의 시험) ----
; 이 DLL이 낸 범위 타격이 치명타로 판정되면 그 대상을 중심으로 스킬이 발동합니다. 손과 매지카를 쓰지 않습니다.
; 치명타 판정은 발동에만 쓰이고 타격의 피해는 올리지 않습니다.

; 발동한 스킬이 피해를 주는 방식
;   direct = 대상의 자리에 피해 없는 폭발을 연출로 띄우고, 피해는 이 DLL이 그 둘레의 적대 대상에게만 직접 줍니다.
;            아군과 플레이어 자신은 맞지 않습니다(설계-현황 결정 52).
;   spell  = TriggerSpell의 주문을 대상에게 시전합니다. 주문의 폭발이 아군과 자신에게도 닿습니다(비교용).
TriggerMode = direct

; direct 방식에서 대상 하나가 받는 체력 피해. 저항과 난이도 배율은 적용하지 않습니다. 1 ~ 100000
TriggerDamage = 40

; direct 방식에서 피해가 닿는 반경(게임 단위). 치명타를 맞은 대상이 중심입니다. 0이면 그 대상만 맞습니다. 0 ~ 1000
TriggerRadius = 200

; direct 방식에서 연출로 띄울 폭발. "플러그인 이름|FormID". 값을 비우면 연출 없이 피해만 줍니다.
; 기본은 화염구의 폭발(Skyrim.esm의 FireBallExp01)입니다. 이 레코드 자체에는 피해가 없습니다.
TriggerExplosion = Skyrim.esm|0x0439C0

; 타격 한 번이 치명타일 기본 확률. 0 ~ 1. 0이면 발동을 끕니다. 시험하기 쉽게 높게 잡은 값입니다.
; 본 모드에서는 이 자리에 우리 스탯(무기, 패시브, 젬, 아이템)으로 계산한 치명타 확률이 들어갑니다.
CritChance = 0.25

; true면 스카이림의 치명타 확률을 위 값에 더합니다(설계-현황 결정 51).
; 스카이림의 값은 액터 값 CriticalChance와 플레이어의 퍽(치명타 확률을 주는 퍽)에서 옵니다. 10%를 주는 퍽이면 0.10이 더해집니다.
; 채널링마다 첫 판정 때 로그에 "치명타 확률 = 기본 + 스카이림"이 한 번 남습니다.
AddSkyrimCrit = true

; 발동 사이의 최소 간격(초). PoE의 "치명타 시 시전"과 같은 0.15가 기본입니다. 0 ~ 5
TriggerCooldown = 0.15

; spell 방식에서 시전할 주문. "플러그인 이름|FormID"로 적습니다. spell 방식에서 값을 비우면 발동을 끕니다.
; 기본은 화염구(Skyrim.esm의 MAG_Fireball)입니다. 폭발이 동료와 자신, 주변의 주민에게도 닿으니
; 마을에서 시험할 때는 주의하세요.
TriggerSpell = Skyrim.esm|0x01C789

; OAR 방식에서 쓸 클립의 가짓수와 처음에 쓸 번호. 1 ~ 9
; "[PoE Proto] 1B Cyclone - OAR" 모드의 서브모드 수와 맞춰야 합니다. 채널링 중 액터 값 Variable09에 번호가 들어갑니다.
; 지금은 정지 자세 클립 하나만 씁니다.
ClipVariants = 1
ClipVariant = 1

; 게임 안에서 클립의 번호를 바꾸는 키(키보드 DirectInput 스캔 코드). 0x44 = F10, 0 = 쓰지 않음
; 클립이 여러 가지일 때 누를 때마다 다음 번호로 넘어가고 화면 왼쪽 위에 "회전 클립 n/N"이 표시됩니다.
CycleKey = 0x44

; 강공격을 별도의 키보드 키로 쓰는 환경에서, 그 키를 누르고 있는 동안에도 채널링이 이어지게 합니다. 0 = 없음
ExtraChannelKey = 0

; 공격 관련 애니메이션 이벤트와 처리 결과를 로그에 남깁니다. 시험용입니다.
LogEvents = true
