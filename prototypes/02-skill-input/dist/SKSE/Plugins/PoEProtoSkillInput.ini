; PoE Proto 2: 입력에 스킬 얹기 시험용 설정
; 게임을 시작할 때 한 번 읽습니다. Motion과 Trigger는 게임 안에서 CycleKey로도 바꿀 수 있습니다.

[General]
; false면 이 DLL은 아무 훅도 설치하지 않습니다.
Enabled = true

; 회전 모션을 재생하는 쪽
;   oar      = OAR 이동 클립 교체. "[PoE Proto] 1B Cyclone - OAR" 모드가 켜져 있어야 합니다.
;   injector = Animation Injector 반복 동작. "[PoE Proto] 1A Cyclone - Animation Injector" 모드가 켜져 있어야 합니다.
Motion = oar

; 채널링을 시작하는 계기
;   powerAttack = 게임이 강공격을 시작하려는 순간을 가로채 채널링으로 바꿉니다. 공격 버튼을 누르고 있는 동안 이어집니다.
;   hold        = 오른손 공격 버튼을 HoldSeconds 넘게 누르고 있으면 시작합니다. 강공격이 다른 키에 있는 환경용입니다.
Trigger = powerAttack

; Trigger = hold일 때 기다리는 시간(초). 0.05 ~ 2
HoldSeconds = 0.3

; 한 번의 채널링이 이어질 수 있는 최대 시간(초). 1 ~ 300
MaxSeconds = 60

; 게임 안에서 방식을 바꾸는 키(키보드 DirectInput 스캔 코드). 0x44 = F10, 0 = 쓰지 않음
; 누를 때마다 OAR+강공격 -> 인젝터+강공격 -> OAR+길게 -> 인젝터+길게 순서로 바뀌고 화면 왼쪽 위에 표시됩니다.
CycleKey = 0x44

; 강공격을 별도의 키보드 키로 쓰는 환경에서, 그 키를 누르고 있는 동안에도 채널링이 이어지게 합니다. 0 = 없음
ExtraChannelKey = 0

; 공격 관련 애니메이션 이벤트와 처리 결과를 로그에 남깁니다. 시험용입니다.
LogEvents = true
