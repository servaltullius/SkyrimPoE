; PoE Proto 5: 아이템의 동일성과 저장 왕복 시험용 설정
; 게임을 시작할 때 한 번 읽습니다.

[General]
; 시험을 시작하는 키(키보드 DirectInput 스캔 코드). 0x44 = F10
; F9는 게임의 빠른 불러오기에 묶여 있어 쓰지 않습니다. 다른 모드가 F10을 쓰고 있으면 다른 키로 바꾸세요.
; 메뉴를 모두 닫고 게임 안에서 누릅니다. 약 1분 동안 시험이 스스로 돌고, 끝나면 화면 왼쪽 위에 할 일이 뜹니다:
; 인벤토리에서 'PoE5 name tag' 검을 버린 뒤 조준해서 다시 줍습니다. 주우면 마무리 단계가 몇 초 더 돌고 "모두 끝났습니다"가 뜹니다.
; 시험은 인벤토리에 철 검·철 투구·철 주괴를 넣고, 발밑에 빈 상자를 하나 놓습니다.
; 모두 끝난 뒤에는 플레이하던 세이브를 다시 불러오세요. 시험 뒤의 상태로 저장하지 마세요.
StartKey = 0x44

; true면 저장하고 불러오는 단계까지 돌립니다. 세이브 두 개(PoEProto5_baseline, PoEProto5_marked)가 새로 생기고,
; 시험 도중 그 세이브들을 불러옵니다. 플레이하던 세이브는 건드리지 않습니다.
; false면 저장·불러오기 없이 옮기기, 버리기, 장착 단계만 돌립니다.
; 지켜보기 시험에서는: true면 준비 뒤 처음 누르는 시작 키가 "저장 왕복"입니다(세이브 PoEProto5_watch를 만들고 곧바로 불러옴).
; 그다음에 누르는 시작 키가 끝입니다. false면 저장 왕복 없이, 준비 뒤 처음 누르는 시작 키가 끝입니다.
SaveLoad = true

; true면 플레이어의 줍기 함수에 끼어들어, 주운 참조와 그때 인벤토리에 생긴 묶음을 직접 봅니다(줍는 동작은 바꾸지 않습니다).
; 바닥을 거친 아이템을 잇는 절차가 이것을 먼저 씁니다.
; false면 끼어들지 않고, 게임이 보내는 이벤트와 묶음 규칙만으로 잇는 절차가 어디까지 되는지를 봅니다.
; 어느 쪽이든 다른 방법들의 답은 로그에 함께 남습니다.
; 지켜보기 시험에서는 false로 둡니다. 확정된 방식(결정 59)이 줍기 함수에 끼어들지 않기 때문입니다.
HookPickUp = false

; 어느 시험을 돌릴지.
; auto  : 위에 적은 자동 시험(약 1분, 불러오기 세 번, 끝에 손으로 버리고 줍기).
; watch : 지켜보기 시험. 시작 키를 누르면 몇 초 동안 준비합니다(표시한 아이템과 단련 재료를 넣고, 발밑에 빈 상자와 죽은 스키버를 놓음).
;         그 뒤에는 화면의 안내대로 직접 합니다(SaveLoad = true일 때):
;         1) 맡기기: 상인에게 'PoE5 A' 검을 팔고, 동료에게 'PoE5 helmet'을 주고, 발밑 상자에 'PoE5 name tag' 검을 넣습니다.
;            'PoE5 B' 검은 스키버 시체에 든 채로 둡니다.
;         2) 메뉴를 닫고 시작 키: 플러그인이 지금 상태를 PoEProto5_watch로 저장하고 곧바로 불러옵니다.
;         3) 되찾기: 상인에게서 되사고, 동료와 상자와 시체에서 꺼냅니다.
;         4) 시작 키를 다시 누르면 끝납니다.
;         플러그인은 아이템의 키를 따라가며 맞는지를 로그에 남깁니다. 끝난 뒤에는 플레이하던 세이브를 불러오세요.
;         지켜보기 중에 게임이 자동 저장을 하면 그 세이브에도 키가 적힙니다. 그 세이브를 부르면 지켜보기가 이어집니다.
Scenario = watch
