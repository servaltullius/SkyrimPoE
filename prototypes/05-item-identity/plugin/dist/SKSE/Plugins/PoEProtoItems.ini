; PoE Proto 5: 아이템의 동일성과 저장 왕복 시험용 설정
; 게임을 시작할 때 한 번 읽습니다.

[General]
; 시험을 시작하는 키(키보드 DirectInput 스캔 코드). 0x44 = F10
; F9는 게임의 빠른 불러오기에 묶여 있어 쓰지 않습니다. 다른 모드가 F10을 쓰고 있으면 다른 키로 바꾸세요.
; 메뉴를 모두 닫고 게임 안에서 누릅니다. 약 40초 동안 시험이 스스로 돌고, 끝나면 화면 왼쪽 위에 알림이 뜹니다.
; 시험은 인벤토리에 철 검·철 투구·철 주괴를 넣고, 발밑에 빈 상자를 하나 놓습니다.
; 시험이 끝난 뒤에는 플레이하던 세이브를 다시 불러오세요. 시험 뒤의 상태로 저장하지 마세요.
StartKey = 0x44

; true면 저장하고 불러오는 단계까지 돌립니다. 세이브 두 개(PoEProto5_baseline, PoEProto5_marked)가 새로 생기고,
; 시험 도중 그 세이브들을 불러옵니다. 플레이하던 세이브는 건드리지 않습니다.
; false면 저장·불러오기 없이 옮기기, 버리기, 장착 단계만 돌립니다.
SaveLoad = true
