; PoE Proto 6: 투사체 시험용 설정
; 게임을 시작할 때 한 번 읽습니다.

[General]
; 시험을 시작하는 키(키보드 DirectInput 스캔 코드). 0x57 = F11
; 다른 모드가 F11을 쓰고 있으면 다른 키로 바꾸세요.
; 평평하고 트인 곳에서, 앞쪽과 좌우 12미터쯤(게임 단위 1200)이 같은 높이로 비어 있는 방향을 보고, 메뉴를 닫고 누릅니다.
; 도시 안, 건물의 단 위, 비탈은 피하세요. 표적이 제자리에 서 있지 않으면 시험이 스스로 멈춥니다.
; 약 45초 동안 시험이 스스로 돕니다. 앞에 스키버 다섯 마리가 놓이고(움직이지 않습니다) 불덩이가 여러 번 날아갑니다.
; 동료는 떼어 두거나 멀리 기다리게 하세요. 동료가 스키버를 공격하면 결과가 흐려집니다.
; 스키버는 끝난 뒤에도 그 자리에 남습니다. "끝났습니다"가 뜨면 플레이하던 세이브를 다시 불러오세요. 시험 뒤의 상태로 저장하지 마세요.
StartKey = 0x57

; true면 미사일 투사체의 적중 함수에 끼어들어, 우리가 쏜 투사체가 무엇에 맞았는지를 그 순간에 압니다.
; 맞은 뒤의 처리(피해, 다시 쏘기)는 이것으로 안 적중에서만 돕니다.
; false면 끼어들지 않고, 아래의 살펴보기와 엔진의 적중 이벤트만으로 무엇이 보이는지를 남깁니다(연쇄·분기·관통은 돌지 않습니다).
; 게임 안의 모든 미사일 투사체가 이 함수를 지나므로, 게임이 투사체가 맞는 순간에 튕기면 이것을 false로 두고 다시 돌려 보세요.
HookImpact = true

; true면 우리가 쏜 투사체의 상태를 15ms마다 읽어, 끼어들지 않고도 적중을 알 수 있는지를 함께 봅니다.
; 엔진이 쓰고 있는 값을 옆에서 읽는 것이라, 게임이 튕기면 이것을 false로 두고 다시 돌려 보세요.
PollState = true

; 적중 한 번에 DLL이 표적에게 주는 피해. 표적(스키버)의 체력이 15쯤이라 작게 둡니다. 0보다 크고 10 이하.
Damage = 1.0
