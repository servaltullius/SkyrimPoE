; 받는 마법 피해와 일곱 타격 자리의 관찰 설정
[General]
; 모드를 바꿀 키보드 스캔 코드. 0x3C는 F2, 0은 키를 쓰지 않음
ModeKey = 0x3C
; 처음 모드. observe는 관찰, scale은 플레이어가 받는 값을 배율로 바꿈
StartMode = observe
; scale에서 곱할 배율. 0 이상 100 이하
Value = 0.5
; true면 플레이어가 아닌 대상도 기록함. 배율은 플레이어에게만 적용
LogAll = false
; true면 엔진의 저항 배율을 다시 읽음. false면 저항 칸에 -를 기록
ReadResistance = true
; AddTarget의 마법 크기 계산 단계를 AMP로 기록함. HookMagic과 독립이며 배율 모드에서도 값은 바꾸지 않음
LogMagnitudeSteps = true
; 폭발 초기화의 피해 계산 단계를 EXP로 기록함. HookHits와 독립이며 배율 모드에서도 값은 바꾸지 않음
LogExplosionSteps = true
; 근접·화살의 퍽·은신·치명타 계산 단계를 STEP으로 기록함. HookHits와 독립이며 배율 모드에서도 값은 바꾸지 않음
LogHitSteps = true
; 받는 마법이 지나는 체력 변경 함수(ID 35086)에 이르는 vtable 15개와 직접 호출 8곳을 가로챔
HookMagic = true
; 근접 타격과 액터의 화살을 포함한 일곱 HitData 호출을 가로챔
HookHits = true
; 모드 안내를 화면에 표시함. 설치 실패 안내는 이 설정과 관계없이 표시
Notify = true
